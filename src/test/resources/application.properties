# Configuration reservee aux tests.
# La base vit dans target/, donc `mvn clean` la supprime et les tests
# ne touchent jamais base.sqlite, la base de developpement.
spring.application.name=book-test

spring.datasource.url=jdbc:sqlite:./target/test.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
